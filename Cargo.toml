[package]
name = "shadow-realm"
version = "0.4.0-experimental.1"
edition = "2024"
rust-version = "1.85"
description = "Experimental Windows VSS snapshot file-operation utility for disposable Windows VMs"
license = "MIT"
authors = ["jsmnsr"]
repository = "https://github.com/jsmnsr/shadow-realm"
readme = "README.md"
keywords = ["windows", "vss", "snapshot", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "deny"
unused_result_ok = "warn"

[profile.release]
strip = true
