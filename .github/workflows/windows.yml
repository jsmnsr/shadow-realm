name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.0', '1.99.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default ${{ matrix.rust }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify without live VSS operations
        if: matrix.rust == '1.85.0'
        shell: powershell
        run: .\scripts\Test.ps1 -Target x86_64-pc-windows-msvc
      - name: Package experimental build
        if: matrix.rust == '1.99.1'
        shell: powershell
        run: .\scripts\Package.ps1 -Target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.rust == '1.99.1'
        with:
          name: windows-x64-experimental
          path: dist/*
          if-no-files-found: error
          retention-days: 7
