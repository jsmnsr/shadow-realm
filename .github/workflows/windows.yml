name: Shadow Realm Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.0', '1.99.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default ${{ matrix.rust }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify without live VSS operations
        if: matrix.rust == '1.85.0'
        shell: powershell
        run: .\scripts\Test.ps1 -Target x86_64-pc-windows-msvc
      - name: Package experimental build
        if: matrix.rust == '1.99.1'
        shell: powershell
        run: .\scripts\Package.ps1 -Target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rust == '1.99.1'
        with:
          name: shadow-realm-windows-x64-experimental
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  live-vss:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the selected revision
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test live OS-volume snapshots
        shell: powershell
        env:
          SHADOW_REALM_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: .\scripts\Test-LiveVss.ps1 -ConfirmLab -OutputDirectory "$env:RUNNER_TEMP\shadow-realm-live-vss"
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-realm-live-vss-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\shadow-realm-live-vss
          if-no-files-found: error
          retention-days: 7
